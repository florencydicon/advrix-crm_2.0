name: Mobile Build — Advrix CRM

on:
  workflow_dispatch:
    inputs:
      provisioning_profile_name:
        description: "iOS provisioning profile name (TestFlight signing)"
        required: false
        default: "Advrix CRM Distribution"
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile-build.yml"]

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build packages (platform 36)
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: npm install + Capacitor sync
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK (share via WhatsApp)
        uses: actions/upload-artifact@v4
        with:
          name: advrix-crm-android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS IPA (TestFlight)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: npm install + Capacitor sync
        working-directory: mobile
        run: |
          npm ci
          npx cap sync ios

      # ----- Signed TestFlight path (requires GitHub Secrets) -----
      - name: Import Apple Distribution cert (P12)
        if: ${{ secrets.APPLE_TEAM_ID != '' && secrets.APPLE_CERT_P12_BASE64 != '' }}
        env:
          P12_B64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: |
          echo "$P12_B64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security list-keychains -d user -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -P "$P12_PASS" -A -t cert -f pkcs12 -k build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
        working-directory: mobile

      - name: Import provisioning profile
        if: ${{ secrets.APPLE_TEAM_ID != '' && secrets.APPLE_PROVISIONING_PROFILE_B64 != '' }}
        env:
          PROV_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_B64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROV_B64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/advrix.mobileprovision
        working-directory: mobile

      - name: Archive (signed, TestFlight)
        if: ${{ secrets.APPLE_TEAM_ID != '' && secrets.APPLE_CERT_P12_BASE64 != '' }}
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE: ${{ inputs.provisioning_profile_name }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -archivePath build/Advrix.xcarchive archive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE"
        working-directory: mobile

      - name: Export IPA
        if: ${{ secrets.APPLE_TEAM_ID != '' && secrets.APPLE_CERT_P12_BASE64 != '' }}
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE: ${{ inputs.provisioning_profile_name }}
        run: |
          mkdir -p export
          cat > export/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.advrix.crm</key><string>$PROFILE</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/Advrix.xcarchive \
            -exportPath export -exportOptionsPlist export/exportOptions.plist
        working-directory: mobile

      - name: Upload IPA to App Store Connect (TestFlight)
        if: ${{ secrets.APPLE_TEAM_ID != '' && secrets.ASC_API_KEY_ID != '' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_B64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -t ios -f export/Advrix\ CRM.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER" --verbose
        working-directory: mobile

      # ----- Unsigned fallback (no secrets): archives the app anyway -----
      - name: Archive (unsigned)
        if: ${{ secrets.APPLE_TEAM_ID == '' }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -archivePath build/Advrix.xcarchive archive CODE_SIGNING_ALLOWED=NO
        working-directory: mobile

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: advrix-crm-ios
          path: |
            mobile/build/Advrix.xcarchive
            mobile/export/*.ipa
          if-no-files-found: ignore