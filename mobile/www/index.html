<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1D2A32" />
    <title>Advrix CRM</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1d2a32;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .wrap { padding: 24px; }
      .logo {
        width: 84px;
        height: 84px;
        border-radius: 18px;
        background: #1d2a32;
        margin: 0 auto 16px;
      }
      p { margin: 6px 0; font-size: 14px; color: #94a3b8; }
      .dot { color: #38bdf8; }
    </style>
  </head>
  <body>
    <!--
      This splash screens while the app loads the live CRM from
      https://advrix-crm-2-0-tdd7-alpha.vercel.app (Capacitor server.url).
    -->
    <div class="wrap">
      <svg class="logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <rect width="512" height="512" rx="96" fill="#1D2A32" />
        <text x="256" y="300" font-size="230" font-weight="700" font-family="Arial, sans-serif" fill="#38BDF8" text-anchor="middle">A</text>
      </svg>
      <p>Advrix CRM<span class="dot">.</span></p>
      <p>Loading…</p>
    </div>
  </body>
</html>
